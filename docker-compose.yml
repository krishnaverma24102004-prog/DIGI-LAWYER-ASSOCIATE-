# Local / single-host deployment: API, ARQ worker and Redis.
#   docker compose up --build
# Secrets come from .env (see .env.example). The Next.js frontend is deployed separately.

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    image: digi-lawyer-api:local
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - model-cache:/app/.cache
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: digi-lawyer-api:local
    command: ["arq", "app.worker.WorkerSettings"]
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - model-cache:/app/.cache
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started  # builds the shared image first
    healthcheck:
      disable: true  # the image's check probes the API's HTTP port
    restart: unless-stopped

volumes:
  redis-data:
  model-cache:
